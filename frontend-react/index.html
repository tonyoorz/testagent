<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PreAnalysis - 汽车测试数据分析平台</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg-primary: #0f0f13;
  --bg-secondary: #16161d;
  --bg-tertiary: #1e1e2e;
  --border: #2a2a3a;
  --text-primary: #e0e0e0;
  --text-secondary: #a0a0b0;
  --accent: #8b8bf5;
  --accent-hover: #9d9df7;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #f87171;
  --info: #60a5fa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg-primary); color: var(--text-primary); }
a { color: var(--accent); text-decoration: none; }

/* Layout */
.app { display: flex; height: 100vh; }
.sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.main-content { flex: 1; overflow-y: auto; padding: 24px; }

/* Sidebar */
.sidebar-logo { padding: 20px; font-size: 18px; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--border); }
.sidebar-logo i { margin-right: 8px; }
.sidebar-nav { flex: 1; padding: 12px 8px; }
.nav-item { display: flex; align-items: center; padding: 10px 12px; color: var(--text-secondary); border-radius: 6px; margin-bottom: 2px; cursor: pointer; font-size: 14px; transition: all 0.15s; }
.nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.nav-item.active { background: var(--bg-tertiary); color: var(--accent); font-weight: 500; }
.nav-item i { width: 20px; margin-right: 10px; text-align: center; }
.nav-section { font-size: 11px; text-transform: uppercase; color: #555; padding: 16px 12px 6px; letter-spacing: 0.5px; }

/* Cards */
.card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }

/* KPI Cards */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.kpi-value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
.kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Filters */
.filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-size: 12px; color: var(--text-secondary); }
select, input[type="text"] { background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 12px; border-radius: 6px; font-size: 14px; outline: none; }
select:focus, input:focus { border-color: var(--accent); }
button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.15s; }
button:hover { background: var(--accent-hover); }
button.secondary { background: var(--bg-tertiary); border: 1px solid var(--border); }
button.secondary:hover { border-color: var(--accent); }

/* Table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--text-secondary); font-weight: 500; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.data-table tr:hover td { background: var(--bg-tertiary); }

/* Chat */
.chat-container { display: flex; flex-direction: column; height: calc(100vh - 48px); }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px 0; }
.chat-msg { display: flex; margin-bottom: 12px; }
.chat-msg.user { justify-content: flex-end; }
.chat-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.chat-msg.user .chat-bubble { background: #2a2a5a; }
.chat-msg.bot .chat-bubble { background: var(--bg-tertiary); }
.chat-input-bar { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
.chat-input-bar input { flex: 1; }

/* Duplicate */
.dup-form { display: flex; gap: 12px; margin-bottom: 20px; }
.dup-form input { flex: 1; }
.dup-results { margin-top: 16px; }
.dup-candidate { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.dup-score { font-size: 24px; font-weight: 700; min-width: 40px; text-align: center; }
.dup-score.high { color: var(--danger); }
.dup-score.medium { color: var(--warning); }
.dup-score.low { color: var(--success); }
.dup-info { flex: 1; }
.dup-title { font-size: 14px; font-weight: 500; }
.dup-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.dup-snippet { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-style: italic; }
.dup-verdict { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; }
.dup-verdict.duplicate { background: #3a1a1a; border: 1px solid var(--danger); color: var(--danger); }
.dup-verdict.likely { background: #3a2a0a; border: 1px solid var(--warning); color: var(--warning); }
.dup-verdict.different { background: #0a3a1a; border: 1px solid var(--success); color: var(--success); }

/* Chart container */
.chart-container { width: 100%; min-height: 400px; }
.plotly-chart { width: 100%; height: 100%; }

/* Loading */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text-secondary); }
.loading i { margin-right: 8px; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* Page header */
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 20px; font-weight: 600; }
.page-header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API_BASE = window.location.port === '5173' ? 'http://localhost:8000' : '';

// ════════════════════════════════════════════════════════════════
// API 工具函数
// ════════════════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}

// ════════════════════════════════════════════════════════════════
// 简易路由
// ════════════════════════════════════════════════════════════════
function Router() {
  const [page, setPage] = useState(window.location.hash.slice(1) || 'explore');
  useEffect(() => {
    const handler = () => setPage(window.location.hash.slice(1) || 'explore');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const pages = {
    explore: <ExplorePage />,
    matrix: <MatrixPage />,
    risk: <RiskPage />,
    longrunner: <LongRunnerPage />,
    coverage: <CoveragePage />,
    qgate: <QGatePage />,
    duplicate: <DuplicatePage />,
    chat: <ChatPage />,
  };

  return (
    <div className="app">
      <Sidebar active={page} />
      <div className="main-content">
        {pages[page] || <ExplorePage />}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// 侧边栏
// ════════════════════════════════════════════════════════════════
function Sidebar({ active }) {
  const items = [
    { section: '数据看板' },
    { id: 'explore', icon: 'fa-chart-bar', label: '缺陷探索' },
    { id: 'matrix', icon: 'fa-th', label: '矩阵分布' },
    { id: 'risk', icon: 'fa-exclamation-triangle', label: '风险分析' },
    { id: 'longrunner', icon: 'fa-clock', label: 'Long Runner' },
    { id: 'coverage', icon: 'fa-check-circle', label: '测试覆盖' },
    { id: 'qgate', icon: 'fa-gate', label: 'Q-Gate' },
    { section: 'AI 助手' },
    { id: 'duplicate', icon: 'fa-copy', label: '重复检测' },
    { id: 'chat', icon: 'fa-comments', label: 'AI 聊天' },
  ];
  return (
    <div className="sidebar">
      <div className="sidebar-logo"><i className="fas fa-robot"></i>PreAnalysis</div>
      <nav className="sidebar-nav">
        {items.map((item, i) => item.section
          ? <div key={i} className="nav-section">{item.section}</div>
          : <a key={i} href={`#${item.id}`} className={`nav-item ${active === item.id ? 'active' : ''}`}>
              <i className={`fas ${item.icon}`}></i>{item.label}
            </a>
        )}
      </nav>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// 缺陷探索页
// ════════════════════════════════════════════════════════════════
function ExplorePage() {
  const [kpis, setKpis] = useState(null);
  const [loading, setLoading] = useState(true);
  const [chartData, setChartData] = useState(null);

  useEffect(() => {
    api('/api/explore/kpis').then(d => { setKpis(d); setLoading(false); }).catch(() => setLoading(false));
    api('/api/explore/trend').then(d => { setChartData(d); Plotly.newPlot('trend-chart', d.data || [], d.layout || {}); }).catch(() => {});
  }, []);

  if (loading) return <div className="loading"><i className="fas fa-spinner"></i>加载中...</div>;

  return (
    <div>
      <div className="page-header">
        <h2>缺陷探索</h2>
        <p>缺陷数据总览与趋势分析</p>
      </div>
      <div className="kpi-grid">
        <KpiCard label="缺陷总数" value={kpis?.total || 0} icon="fa-bug" />
        {kpis?.phase_distribution && Object.entries(kpis.phase_distribution).slice(0, 3).map(([k, v]) =>
          <KpiCard key={k} label={k} value={v} />
        )}
      </div>
      <div className="card">
        <div className="card-header"><span className="card-title">缺陷趋势</span></div>
        <div id="trend-chart" className="chart-container"></div>
      </div>
      {kpis?.project_distribution && (
        <div className="card">
          <div className="card-header"><span className="card-title">项目分布</span></div>
          <table className="data-table">
            <thead><tr><th>项目</th><th>缺陷数</th></tr></thead>
            <tbody>{Object.entries(kpis.project_distribution).map(([k, v]) =>
              <tr key={k}><td>{k}</td><td>{v}</td></tr>
            )}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function KpiCard({ label, value, icon }) {
  return (
    <div className="kpi-card">
      <div className="kpi-label">{icon && <i className={`fas ${icon}`} style={{marginRight: 6}}></i>}{label}</div>
      <div className="kpi-value">{typeof value === 'number' ? value.toLocaleString() : value}</div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// 矩阵分布页
// ════════════════════════════════════════════════════════════════
function MatrixPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api('/api/matrix/figure').then(d => {
      setData(d);
      if (d.data) Plotly.newPlot('matrix-chart', d.data, d.layout || {});
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  return (
    <div>
      <div className="page-header"><h2>矩阵分布</h2><p>缺陷按 Matrix 等级分布</p></div>
      {loading ? <div className="loading"><i className="fas fa-spinner"></i>加载中...</div> : (
        <div className="card">
          <div id="matrix-chart" className="chart-container"></div>
          {data?.matrix_counts && (
            <table className="data-table" style={{marginTop: 16}}>
              <thead><tr><th>等级</th><th>数量</th></tr></thead>
              <tbody>{Object.entries(data.matrix_counts).map(([k, v]) =>
                <tr key={k}><td>{k}</td><td>{v}</td></tr>
              )}</tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// 风险分析页
// ════════════════════════════════════════════════════════════════
function RiskPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    api('/api/risk/analysis').then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
  }, []);
  if (loading) return <div className="loading"><i className="fas fa-spinner"></i>加载中...</div>;
  return (
    <div>
      <div className="page-header"><h2>风险分析</h2><p>缺陷风险评估总览</p></div>
      <div className="kpi-grid">
        <KpiCard label="缺陷总数" value={data?.total_defects || 0} icon="fa-bug" />
        {data?.severity_distribution && Object.entries(data.severity_distribution).map(([k, v]) =>
          <KpiCard key={k} label={k} value={v} />
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// LongRunner / Coverage / QGate 占位页
// ════════════════════════════════════════════════════════════════
function LongRunnerPage() {
  const [data, setData] = useState(null);
  useEffect(() => { api('/api/longrunner/data').then(setData); }, []);
  return <div><div className="page-header"><h2>Long Runner</h2><p>长期未解决缺陷追踪</p></div>
    <div className="card"><pre>{JSON.stringify(data, null, 2)}</pre></div></div>;
}
function CoveragePage() {
  const [data, setData] = useState(null);
  useEffect(() => { api('/api/coverage/data').then(setData); }, []);
  return <div><div className="page-header"><h2>测试覆盖</h2><p>测试用例覆盖分析</p></div>
    <div className="kpi-grid"><KpiCard label="测试用例总数" value={data?.total_test_cases || 0} icon="fa-vial" /></div>
    {data?.project_distribution && <div className="card"><table className="data-table"><thead><tr><th>项目</th><th>用例数</th></tr></thead>
      <tbody>{Object.entries(data.project_distribution).map(([k, v]) => <tr key={k}><td>{k}</td><td>{v}</td></tr>)}</tbody></table></div>}</div>;
}
function QGatePage() {
  const [data, setData] = useState(null);
  useEffect(() => { api('/api/qgate/kpis').then(setData); }, []);
  return <div><div className="page-header"><h2>Q-Gate</h2><p>质量门禁指标</p></div>
    <div className="card"><pre>{JSON.stringify(data, null, 2)}</pre></div></div>;
}

// ════════════════════════════════════════════════════════════════
// 重复检测页
// ════════════════════════════════════════════════════════════════
function DuplicatePage() {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);

  const search = async () => {
    if (!query.trim()) return;
    setLoading(true);
    const data = await api('/api/duplicate/search', {
      method: 'POST',
      body: JSON.stringify({ query, top_k: 10 }),
    });
    setResults(data);
    setLoading(false);
  };

  const getVerdict = (candidates) => {
    if (!candidates?.length) return { text: '未找到相似缺陷，可以提票', type: 'different' };
    const best = Math.max(...candidates.map(c => c.score_1_10));
    if (best >= 8) return { text: `发现高度相似缺陷（${best}分），不建议重复提票`, type: 'duplicate' };
    if (best >= 7) return { text: `存在相似缺陷（${best}分），需补充信息确认`, type: 'likely' };
    return { text: `最相似缺陷评分仅 ${best} 分，可以提票`, type: 'different' };
  };

  return (
    <div>
      <div className="page-header"><h2>重复缺陷检测</h2><p>输入问题描述，检索历史相似缺陷</p></div>
      <div className="dup-form">
        <input type="text" placeholder="描述你的问题，如：IDCEvo换挡时变速箱异响" value={query}
          onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && search()} />
        <button onClick={search} disabled={loading}>
          {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-search"></i>} 检索
        </button>
      </div>
      {results && (
        <>
          {(() => {
            const v = getVerdict(results.candidates);
            return <div className={`dup-verdict ${v.type}`}><i className={`fas ${v.type === 'duplicate' ? 'fa-exclamation-circle' : v.type === 'likely' ? 'fa-question-circle' : 'fa-check-circle'}`}></i> {v.text}</div>;
          })()}
          <div className="dup-results">
            {results.candidates?.map((c, i) => (
              <div key={i} className="dup-candidate">
                <div className={`dup-score ${c.score_1_10 >= 8 ? 'high' : c.score_1_10 >= 7 ? 'medium' : 'low'}`}>{c.score_1_10}</div>
                <div className="dup-info">
                  <div className="dup-title">{c.ticket_id ? `#${c.ticket_id}` : ''} {c.name}</div>
                  <div className="dup-meta">{[c.project, c.pu, c.status_phase].filter(Boolean).join(' · ')} · 相似度 {(c.similarity * 100).toFixed(1)}%</div>
                  {c.snippet && <div className="dup-snippet">{c.snippet}</div>}
                </div>
              </div>
            ))}
            {results.candidates?.length === 0 && <div className="card" style={{textAlign:'center', padding: 40, color: 'var(--text-secondary)'}}>
              <i className="fas fa-inbox" style={{fontSize: 32, marginBottom: 12}}></i><br/>未检索到候选缺陷</div>}
          </div>
        </>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// AI 聊天页
// ════════════════════════════════════════════════════════════════
function ChatPage() {
  const [messages, setMessages] = useState([
    { role: 'bot', text: '你好，我是 PreAnalysis AI 助手。你可以问我关于缺陷数据、测试覆盖、风险分析等问题。' }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [ws, setWs] = useState(null);
  const messagesEnd = useRef(null);

  useEffect(() => {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const host = API_BASE ? API_BASE.replace(/^http/, '').replace('//', '') : window.location.host;
    try {
      const socket = new WebSocket(`${protocol}//${host}/api/chat/ws`);
      socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'done') {
          setMessages(prev => [...prev, { role: 'bot', text: data.text }]);
          setLoading(false);
        }
      };
      socket.onerror = () => {};
      setWs(socket);
      return () => socket.close();
    } catch (e) { /* WebSocket 不可用，回退到 HTTP */ }
  }, []);

  useEffect(() => { messagesEnd.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const text = input.trim();
    setInput('');
    setMessages(prev => [...prev, { role: 'user', text }]);
    setLoading(true);

    if (ws?.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ question: text }));
    } else {
      try {
        const data = await api('/api/chat/ask', {
          method: 'POST',
          body: JSON.stringify({ question: text }),
        });
        setMessages(prev => [...prev, { role: 'bot', text: data.text || '无响应' }]);
      } catch (e) {
        setMessages(prev => [...prev, { role: 'bot', text: `请求失败: ${e.message}` }]);
      }
      setLoading(false);
    }
  };

  return (
    <div className="chat-container">
      <div className="chat-messages">
        {messages.map((m, i) => (
          <div key={i} className={`chat-msg ${m.role}`}>
            <div className="chat-bubble">{m.text}</div>
          </div>
        ))}
        {loading && <div className="chat-msg bot"><div className="chat-bubble"><i className="fas fa-spinner fa-spin"></i> 思考中...</div></div>}
        <div ref={messagesEnd} />
      </div>
      <div className="chat-input-bar">
        <input type="text" placeholder="输入你的问题..." value={input}
          onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} />
        <button onClick={send}><i className="fas fa-paper-plane"></i></button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// 渲染
// ════════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<Router />);
</script>
</body>
</html>
